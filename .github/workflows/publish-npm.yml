name: Publish npm installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: npm version, for example 0.5.0
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public installer source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use current npm CLI
        run: npm install --global npm@latest

      - name: Publish @inoku/lifedrive
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${MANUAL_VERSION:-${RELEASE_TAG#lifedrive-v}}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid npm version: $VERSION" >&2
            exit 1
          fi
          if npm view "@inoku/lifedrive@$VERSION" version >/dev/null 2>&1; then
            echo "@inoku/lifedrive@$VERSION is already published."
            exit 0
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm publish --access public
